<style>
  :root { --green:#76e35d; --dark:#101510; --panel:rgba(17,24,18,.88); }
  * { box-sizing:border-box; font-family:"Comic Neue", "Comic Sans MS", "Comic Sans", "Chalkboard", cursive; }
  body {
    margin:0; min-height:100vh; overflow:hidden; color:#fff;
    display:flex; align-items:center; justify-content:center; background:#111;
  }
  .world {
    position:fixed; inset:0; z-index:-2; overflow:hidden;
    background:linear-gradient(#263b58 0%,#67899a 55%,#47743d 55%,#20351f 100%);
  }
  .sun { position:absolute; width:90px;height:90px;background:#ffe9a3;top:12%;right:16%;border:3px solid #f5d978; animation:float 7s ease-in-out infinite; }
  .block { position:absolute; bottom:-25px; width:150px; height:210px; background:#29472c; transform:skewY(-10deg); box-shadow:inset 0 20px #426b39, inset 0 35px #203c27; animation:drift 8s ease-in-out infinite alternate; }
  .block:before { content:"";position:absolute;left:-65px;top:12px;width:65px;height:190px;background:#1a3024;transform:skewY(25deg); }
  .b1 {left:8%;height:170px}.b2 {left:29%;height:260px;animation-delay:-3s}.b3 {right:24%;height:190px;animation-delay:-1s}.b4 {right:3%;height:290px;animation-delay:-4s}
  .pixel { position:absolute; width:12px;height:12px;background:#ffffff12; animation:twinkle 3s ease-in-out infinite; }
  .shade {position:fixed;inset:0;background:radial-gradient(ellipse at center,transparent 10%,#050807a8 100%);z-index:-1}
  main { width:min(92vw,620px);padding:30px;text-align:center;background:rgba(20,29,20,.94);border:3px solid #82977b;box-shadow:7px 7px 0 #111;animation:arrive .5s ease-out both; }
  .logo {display:block;width:min(100%, 560px);height:auto;margin:0 auto 10px;}
  .subtitle {color:#d6e4d0;letter-spacing:0;font-size:1rem;margin:15px 0 28px}
  .warnings {display:grid;gap:12px;text-align:left;margin:0 auto 26px;max-width:510px}
  .warning {display:flex;gap:12px;align-items:flex-start;padding:12px;border:1px solid #a18c4b;background:#302d20;color:#f4e4ad;line-height:1.45;animation:fadeUp .5s both}
  .warning:nth-child(2){animation-delay:.2s}
  .symbol {font-size:1.25rem;line-height:1.2}
  .credit {color:#c6cfc6;font-size:.9rem;margin:18px 0 24px;font-style:italic}
  .play {display:inline-flex;align-items:center;justify-content:center;gap:10px;min-width:210px;padding:14px 26px;border:2px solid #a5f091;background:#65bd50;color:#10200d;font-weight:bold;font-size:1.1rem;text-decoration:none;box-shadow:0 4px 0 #31572c;transition:transform .15s; }
  .play:hover {transform:translateY(-2px);background:#7ce365}
  .play:active {transform:translateY(3px);box-shadow:0 2px 0 #3b7c31}
  .foot {font-size:.75rem;color:#a9b9a5;margin-top:24px}
  @keyframes arrive {from{opacity:0;transform:translateY(22px) scale(.97)}to{opacity:1;transform:none}}
  @keyframes fadeUp {from{opacity:0;transform:translateY(12px)}to{opacity:1;transform:none}}
  @keyframes float {50%{transform:translateY(15px)}}
  @keyframes drift {to{transform:translate(12px,-8px) skewY(-10deg)}}
  @keyframes twinkle {50%{opacity:.3;transform:scale(.8)}}
  @media (prefers-reduced-motion:reduce) { *,*::before,*::after{animation:none!important;transition:none!important} }
</style>
</head>
